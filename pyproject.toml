[project]
name = "visualisation-prenoms"
version = "0.1.0"
description = "Visualisation des prénoms en France 1900-2020"
authors = [
    {name = "omarf"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "altair (>=6.1.0,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "vega-datasets (>=0.9.0,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
